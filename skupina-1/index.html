<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d8edcc">
<title>Chyť krtka – skupina 1</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24334a;background:#d8edcc}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:clamp(12px,3vw,28px);display:grid;place-items:center}
main{width:min(100%,620px);background:#fff;border-radius:26px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 36px #23401d20;text-align:center}
h1{font-size:clamp(30px,7vw,46px);margin:4px 0}
.subtitle{margin:4px 0 18px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.stat{background:#f0f7eb;border-radius:14px;padding:10px 4px}
.stat strong{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#52634f}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.5vw,15px);width:min(100%,430px);margin:18px auto}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:#8b5a36;box-shadow:inset 0 8px 0 #633d28,0 5px 0 #6f482e;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:manipulation;cursor:pointer}
.hole:focus-visible{outline:4px solid #f0b429;outline-offset:3px}
.mole{font-size:clamp(42px,11vw,68px);line-height:1;transform:translateY(3px);user-select:none}
.hole:not(.up) .mole{visibility:hidden}
.hole.up{background:#a96e43}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
button.action{border:0;border-radius:14px;padding:13px 24px;font:700 18px inherit;cursor:pointer;touch-action:manipulation}
#start{background:#287a3e;color:white}
#start:disabled{opacity:.55;cursor:default}
#reset{background:#edf2e9;color:#344b32}
#message{min-height:28px;font-weight:650;font-size:17px}
.help{font-size:14px;color:#596657;margin:8px 0}
.version{font-size:12px;color:#7a8477;margin-top:18px}
@media(max-width:380px){main{padding:16px}.stats{gap:5px}.stat{padding:8px 2px}}
</style>
</head>
<body>
<main>
<div aria-hidden="true" style="font-size:42px">🌿</div>
<h1>Chyť krtka!</h1>
<p class="subtitle">Skupina 1 · Klikni nebo ťukni na krtka.</p>
<section class="stats" aria-label="Stav hry">
<div class="stat"><strong id="score">0</strong><span>Body</span></div>
<div class="stat"><strong id="time">30</strong><span>Sekundy</span></div>
<div class="stat"><strong id="best">0</strong><span>Rekord</span></div>
</section>
<div class="board" id="board" aria-label="Herní plocha">
<button class="hole" type="button" aria-label="Díra 1" data-hole="0"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 2" data-hole="1"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 3" data-hole="2"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 4" data-hole="3"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 5" data-hole="4"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 6" data-hole="5"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 7" data-hole="6"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 8" data-hole="7"><span class="mole" aria-hidden="true">🐹</span></button><button class="hole" type="button" aria-label="Díra 9" data-hole="8"><span class="mole" aria-hidden="true">🐹</span></button>
</div>
<div class="controls">
<button class="action" id="start" type="button">▶ Začít hru</button>
<button class="action" id="reset" type="button">↻ Nová hra</button>
</div>
<p id="message" role="status" aria-live="polite">Připrav se! Máš 30 sekund.</p>
<p class="help">Za každého chyceného krtka získáš 1 bod. Pozor, krtek zrychluje!</p>
<p class="version">Chyť krtka · skupina 1 · verze 1.0</p>
</main>
<script>
(() => {
 const holes=[...document.querySelectorAll(".hole")];
 const scoreEl=document.getElementById("score");
 const timeEl=document.getElementById("time");
 const bestEl=document.getElementById("best");
 const message=document.getElementById("message");
 const startBtn=document.getElementById("start");
 let score=0,time=30,best=0,current=-1,playing=false,tick=null,moleTimer=null;
 try{best=Number(localStorage.getItem("krtek-sk1-best"))||0}catch(e){}
 bestEl.textContent=best;
 function hideMole(){holes.forEach(h=>h.classList.remove("up"));current=-1}
 function showMole(){
   if(!playing)return;
   let next=Math.floor(Math.random()*holes.length);
   if(holes.length>1&&next===current)next=(next+1+Math.floor(Math.random()*(holes.length-1)))%holes.length;
   hideMole();current=next;holes[current].classList.add("up");
   const speed=Math.max(430,1050-score*22);
   moleTimer=setTimeout(showMole,speed);
 }
 function finish(){
   playing=false;clearInterval(tick);clearTimeout(moleTimer);hideMole();startBtn.disabled=false;
   message.textContent="Konec hry! Získal/a jsi "+score+" bodů. Zkus překonat svůj rekord!";
 }
 function start(){
   if(playing)return;
   clearInterval(tick);clearTimeout(moleTimer);score=0;time=30;playing=true;
   scoreEl.textContent=score;timeEl.textContent=time;startBtn.disabled=true;
   message.textContent="Hurá! Chytej krtka!";
   showMole();
   tick=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000);
 }
 holes.forEach(h=>h.addEventListener("click",()=>{
   if(!playing||!h.classList.contains("up"))return;
   score++;scoreEl.textContent=score;
   if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("krtek-sk1-best",String(best))}catch(e){}}
   clearTimeout(moleTimer);hideMole();showMole();
 }));
 startBtn.addEventListener("click",start);
 document.getElementById("reset").addEventListener("click",()=>{
   clearInterval(tick);clearTimeout(moleTimer);playing=false;score=0;time=30;
   scoreEl.textContent=score;timeEl.textContent=time;hideMole();startBtn.disabled=false;
   message.textContent="Připraven/a? Stiskni Začít hru."; 
 });
})();
</script>
</body>
</html>
