<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Krtek Stanislav – 3D metro</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#080e18;color:#fff;overflow:hidden;touch-action:manipulation}
#game{position:relative;width:100vw;height:100dvh;min-height:520px;overflow:hidden;background:linear-gradient(#111b2b 0 12%,#242c37 48%,#090d13 100%);perspective:850px}
.ceiling{position:absolute;inset:0 0 48%;background:repeating-linear-gradient(90deg,#353b42 0 12%,#252b32 12.5% 24%);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.tunnel{position:absolute;inset:4% 0 0;background:radial-gradient(ellipse at 50% 38%,#5a6063 0,#333b42 42%,#111923 78%);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.lamps{position:absolute;top:8%;left:15%;right:15%;height:12%;display:flex;justify-content:space-around;filter:drop-shadow(0 0 18px #ffd76a)}
.lamps i{width:9%;height:10px;border-radius:50%;background:#ffe59a;box-shadow:0 0 20px 8px #ffd35b}
.sign{position:absolute;z-index:2;top:14%;left:50%;transform:translateX(-50%);background:#183c55;border:3px solid #e5c56a;border-radius:7px;padding:5px 20px;font-weight:1000;letter-spacing:3px;box-shadow:0 0 18px #ffcf5a66}
.world{position:absolute;inset:19% 0 0;transform-style:preserve-3d;transform:rotateX(12deg);transform-origin:50% 0}
.floor{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#282b2d 0 35px,#34383a 36px 39px);clip-path:polygon(39% 0,61% 0,100% 100%,0 100%)}
.lane{position:absolute;top:0;bottom:0;width:33.333%;border-left:2px solid #b8a16c33;border-right:2px solid #b8a16c33}
.lane:nth-child(2){left:0}.lane:nth-child(3){left:33.333%}.lane:nth-child(4){left:66.666%}
.rail{position:absolute;top:0;bottom:-5%;width:7px;background:linear-gradient(90deg,#56616a,#f4f0d8,#59636b);box-shadow:0 0 7px #cbd8e5;transform:perspective(400px) rotateX(-5deg);transform-origin:top}
.rail.r1{left:22%}.rail.r2{left:44%}.rail.r3{left:56%}.rail.r4{left:78%}
.sleepers{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 35px,#8a6b4b 36px 43px,transparent 44px 62px);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);opacity:.9}
#player{position:absolute;z-index:6;bottom:9%;left:50%;width:78px;height:142px;transform:translateX(-50%);transition:left .14s;filter:drop-shadow(0 12px 7px #000b);transform-style:preserve-3d}
.officer{position:absolute;bottom:0;left:8px;width:62px;height:78px;background:linear-gradient(90deg,#07366e,#1675bd 45%,#06427f);border:3px solid #082747;border-radius:18px 18px 13px 13px;box-shadow:inset -8px 0 #031f45}
.officer:before{content:"★";position:absolute;right:7px;top:8px;color:#ffdf72;font-size:19px}
.head{position:absolute;bottom:69px;left:15px;width:49px;height:49px;border-radius:45%;background:radial-gradient(circle at 35% 28%,#ffe0b4,#c98252);border:3px solid #573a2b;text-align:center;color:#18233a;font-size:20px;padding-top:7px}
.head:after{content:"〰";position:absolute;left:4px;top:24px;color:#111;font-size:27px;font-weight:1000}
.cap{position:absolute;z-index:2;bottom:108px;left:9px;width:61px;height:23px;background:linear-gradient(#315f9d,#102f5d);border:3px solid #091d37;border-radius:24px 24px 5px 5px}
.cap:after{content:"";position:absolute;right:-8px;bottom:-4px;width:29px;height:7px;background:#142d50;border-radius:8px}
.legs{position:absolute;bottom:-14px;left:17px;display:flex;gap:9px}.legs i{width:18px;height:25px;background:#123f72;border-radius:4px 4px 8px 8px;border-bottom:7px solid #181b20}
.object{position:absolute;z-index:5;left:50%;top:-100px;transform:translateX(-50%);font-size:clamp(42px,8vw,72px);filter:drop-shadow(0 8px 5px #000b);will-change:top}
.object.food{font-size:48px}.object.train{font-size:clamp(58px,11vw,94px)}.object.barrier{font-size:clamp(44px,9vw,76px)}
.hud{position:absolute;z-index:12;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-weight:900}
.pill{background:#071727eF;border:2px solid #d8bd70;border-radius:12px;padding:6px 10px;font-size:clamp(12px,3vw,18px)}
#boostButton{background:#c62828;border:3px solid #ffb0a4;border-radius:14px;color:#fff;font-weight:1000;padding:9px 13px;font-size:15px;box-shadow:0 4px #751515}
#boostButton:disabled{opacity:.48;filter:grayscale(.7)}
.controls{position:absolute;z-index:12;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.controls button{background:#164f80;border:2px solid #9edfff;border-radius:12px;color:white;padding:11px 14px;font-size:clamp(15px,3.5vw,20px);font-weight:900;box-shadow:0 4px #092b4b}
#overlay{position:absolute;z-index:20;inset:0;background:#07111beF;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.panel{max-width:490px;background:linear-gradient(145deg,#1d4262,#10243e);border:3px solid #e2c36f;border-radius:22px;padding:24px;box-shadow:0 15px 45px #000b}
.panel h1{font-size:clamp(27px,6vw,42px);margin:0 0 10px}.panel p{line-height:1.45}.mainbtn{background:#087b4b;color:white;border:2px solid #a9ffd1;border-radius:12px;padding:13px 22px;font-weight:1000;font-size:20px}
.small{font-size:12px;opacity:.8}
.jump{animation:jump .65s ease}.slide{transform:translateX(-50%) scale(.75,.55)!important;transform-origin:bottom}
@keyframes jump{50%{bottom:30%}}
@media(max-height:620px){#player{bottom:7%;transform:translateX(-50%) scale(.8);transform-origin:bottom}.controls{bottom:5px}.controls button{padding:7px 10px}.hud{top:5px}}
</style>
</head>
<body>
<main id="game">
<div class="tunnel"></div><div class="ceiling"></div><div class="lamps"><i></i><i></i><i></i><i></i><i></i></div><div class="sign">🚇 METRO</div>
<div class="world"><div class="floor"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="sleepers"></div><div class="rail r1"></div><div class="rail r2"></div><div class="rail r3"></div><div class="rail r4"></div></div>
<div class="hud"><div class="pill">⭐ <span id="score">0</span> bodů</div><div class="pill">❤️ <span id="lives">5</span></div><div class="pill">⚡ Boosty: <span id="boosts">0</span></div><div class="pill">⏱️ <span id="boostTime">—</span></div><button id="boostButton" disabled>⚡ BOOST</button></div>
<div id="player"><div class="cap"></div><div class="head">• •</div><div class="officer"></div><div class="legs"><i></i><i></i></div></div>
<div class="controls"><button id="left">⬅️</button><button id="jump">⬆️ SKOK</button><button id="slide">⬇️ PODLÉZT</button><button id="right">➡️</button></div>
<div id="overlay"><div class="panel"><h1>🚨 Krtek Stanislav</h1><p>Pomoz policistovi proběhnout 3D metrem! Uhýbej vlakům, přeskakuj zábrany a sbírej hranolky. Hra končí, až ztratíš všech 5 životů.</p><p><b>PC:</b> šipky ← →, ↑ skok, ↓ podlézt<br><b>Mobil / tablet:</b> tlačítka nebo přejetí prstem</p><button class="mainbtn" id="start">▶ ZAČÍT HRÁT</button><p class="small">Verze 0.2 · 3D metro</p></div></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),game=$('game'),player=$('player');let lane=1,score=0,lives=5,boosts=0,boostLeft=0,running=false,objects=[],last=0,spawn=0,raf=0,clock=0;const centers=['16.666%','50%','83.333%'];function hud(){$('score').textContent=score;$('lives').textContent=lives;$('boosts').textContent=boosts;$('boostButton').disabled=!running||boosts<1;$('boostTime').textContent=boostLeft>0?boostLeft.toFixed(1)+' s':'—'}function place(){player.style.left=centers[lane]}function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));place()}function pose(a){if(!running)return;player.classList.remove('jump','slide');void player.offsetWidth;player.classList.add(a);setTimeout(()=>player.classList.remove(a),650)}function spawnObj(){const l=Math.floor(Math.random()*3),r=Math.random(),kind=r<.25?'food':r<.67?'train':'barrier';const el=document.createElement('div');el.className='object '+kind;el.textContent=kind==='food'?'🍟':kind==='train'?'🚇':'🚧';el.style.left=centers[l];game.appendChild(el);objects.push({el,l,kind,y:-100,checked:false})}
function tick(now){if(!running)return;const dt=Math.min((now-last)/1000,.05);last=now;spawn+=dt;if(spawn>(boostLeft>0?.78:1.05)){spawn=0;spawnObj()}const speed=(boostLeft>0?1.1:1)*300;for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=speed*dt;o.el.style.top=o.y+'px';const hit=o.y>game.clientHeight*.68&&o.y<game.clientHeight*.83&&o.l===lane&&!o.checked;if(hit){o.checked=true;if(o.kind==='food'){score+=10;const before=Math.floor((score-10)/500),after=Math.floor(score/500);boosts+=after-before;hud()}else if(o.kind==='train'){lives--;hud();if(lives<=0){finish();return}}else if(!player.classList.contains('jump')&&!player.classList.contains('slide')){lives--;hud();if(lives<=0){finish();return}}}if(o.y>game.clientHeight+100){o.el.remove();objects.splice(i,1)}}if(boostLeft>0){boostLeft=Math.max(0,boostLeft-dt);hud()}raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);objects.forEach(o=>o.el.remove());objects=[];lane=1;score=0;lives=5;boosts=0;boostLeft=0;spawn=0;running=true;place();hud();$('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(tick)}
function finish(){running=false;cancelAnimationFrame(raf);$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><h1>🚨 Konec hry!</h1><p>Policistovi došly životy. Dobrá práce!</p><p>Nasbírané body: <b>'+score+'</b><br>Zbývající hranolky proměnily se v parádní skóre!</p><button class="mainbtn" id="again">↻ HRÁT ZNOVU</button><p class="small">Krtek Stanislav · Verze 0.2</p></div>';$('again').onclick=start;hud()}
function useBoost(){if(!running||boosts<1||boostLeft>0)return;boosts--;boostLeft=20;hud()}
$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=()=>pose('jump');$('slide').onclick=()=>pose('slide');$('boostButton').onclick=useBoost;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')pose('jump');if(e.key==='ArrowDown')pose('slide');if(e.key.toLowerCase()==='b')useBoost()});let sx=0,sy=0;game.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});game.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(Math.abs(dy)>35)pose(dy<0?'jump':'slide')},{passive:true});place();hud()})();
</script>
</body></html>
