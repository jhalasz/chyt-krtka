<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Krtek Stanislav – honička v metru</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b35;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
#game{position:relative;width:100vw;height:100dvh;min-height:480px;overflow:hidden;background:linear-gradient(#263b62 0 17%,#e6a45d 17% 19%,#4c5264 19% 100%)}
.tunnel{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#7bc9ed 0,#334e76 36%,#1c2942 75%);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.sign{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-weight:900;letter-spacing:3px;color:#fff;background:#0759a9;border:4px solid #8ed9ff;border-radius:12px;padding:7px 25px;box-shadow:0 5px #12345c}
.track-area{position:absolute;inset:20% 0 0;perspective:550px}.track{position:absolute;bottom:-12%;height:110%;width:34%;background:repeating-linear-gradient(0deg,#80512e 0 8px,#b47b45 8px 20px,#68452d 20px 26px);transform-origin:bottom;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}.track:nth-child(1){left:-1%;}.track:nth-child(2){left:33%;}.track:nth-child(3){right:-1%}
.rail{position:absolute;bottom:-5%;height:105%;width:7px;background:linear-gradient(90deg,#788b9c,#fff,#65778c);transform-origin:bottom;box-shadow:0 0 5px #d8efff}
.rail.r1{left:22%;transform:perspective(500px) rotateX(22deg) scaleY(1.1)}.rail.r2{left:44%;transform:perspective(500px) rotateX(22deg) scaleY(1.1)}.rail.r3{left:56%;transform:perspective(500px) rotateX(22deg) scaleY(1.1)}.rail.r4{left:78%;transform:perspective(500px) rotateX(22deg) scaleY(1.1)}
.lane-lines{position:absolute;inset:0;background:linear-gradient(90deg,transparent 32.8%,#e6c18b 33%,transparent 33.3%,transparent 66.5%,#e6c18b 66.8%,transparent 67%)}
.hud{position:absolute;z-index:10;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-weight:900}.pill{background:#071a35dd;border:2px solid #8bd8ff;border-radius:14px;padding:7px 12px;font-size:clamp(14px,3vw,20px)}
#player{position:absolute;z-index:5;bottom:12%;left:50%;width:90px;height:145px;transform:translateX(-50%);transition:left .15s;display:flex;align-items:center;flex-direction:column;filter:drop-shadow(0 8px 4px #1118)}
.cap{font-size:35px;line-height:30px;z-index:2}.head{width:61px;height:54px;border-radius:45% 45% 48% 48%;background:#ffc58b;border:3px solid #693b28;position:relative;text-align:center;color:#182b4a;font-size:22px;line-height:39px}.eyes{letter-spacing:8px;margin-left:7px}.moustache{position:absolute;top:27px;left:7px;font-size:25px;color:#111;line-height:20px;text-shadow:1px 1px #333}.body{width:83px;height:62px;background:#0755a8;border:3px solid #092b52;border-radius:20px 20px 13px 13px;position:relative}.body:after{content:"★";position:absolute;right:9px;top:6px;color:#fff;font-size:18px}.belt{height:10px;background:#252a34;border:2px solid #aaa;position:absolute;bottom:10px;left:0;right:0}.legs{display:flex;gap:9px}.legs i{display:block;width:27px;height:32px;background:#064080;border-radius:6px 6px 12px 12px;border-bottom:8px solid #20232a}.jump{animation:jump .65s ease}.slide{transform:translateX(-50%) scale(.72,.65)!important;transform-origin:bottom;bottom:10%!important}
@keyframes jump{50%{bottom:32%}}.object{position:absolute;z-index:4;font-size:clamp(36px,7vw,64px);filter:drop-shadow(0 5px 3px #1118);transition:none}.object.hazard{font-size:clamp(40px,8vw,68px)}.object.coin{font-size:40px}
.controls{position:absolute;z-index:12;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button,.mainbtn{border:2px solid #a6e7ff;background:#0756a7;color:white;border-radius:14px;padding:12px 18px;font-size:20px;font-weight:900;box-shadow:0 4px #062c5a}
#overlay{position:absolute;z-index:20;inset:0;background:#09172beF;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}.panel{max-width:480px;background:#17345c;border:3px solid #77d8ff;border-radius:24px;padding:26px;box-shadow:0 15px 45px #0008}.panel h1{font-size:clamp(27px,6vw,42px);margin:0 0 10px}.panel p{line-height:1.5}.small{font-size:13px;opacity:.8}
@media(min-width:800px){#player{bottom:10%}.controls{bottom:18px}.controls button{padding:10px 22px}}
</style></head>
<body><main id="game"><div class="tunnel"></div><div class="sign">🚇 METRO</div><div class="track-area"><div class="track"></div><div class="track"></div><div class="track"></div><div class="lane-lines"></div><div class="rail r1"></div><div class="rail r2"></div><div class="rail r3"></div><div class="rail r4"></div></div>
<div class="hud"><div class="pill">⭐ Skóre: <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span> s</div><div class="pill">🏃 Kolej: <span id="laneLabel">2</span>/3</div></div>
<div id="player"><div class="cap">🧢</div><div class="head"><span class="eyes">• •</span><span class="moustache">〰</span></div><div class="body"><div class="belt"></div></div><div class="legs"><i></i><i></i></div></div>
<div class="controls"><button id="left">⬅️</button><button id="jump">⬆️ SKOK</button><button id="slide">⬇️ PODLÉZT</button><button id="right">➡️</button></div>
<div id="overlay"><div class="panel"><h1>🚨 Krtek Stanislav</h1><p>Pomozte policistovi běžet metrem! Přeskakujte 🧱, podlézejte 🚧 a sbírejte 🍟.</p><p><b>PC:</b> šipky ← →, ↑ skok, ↓ podlézt<br><b>Mobil:</b> tlačítka nebo přejetí prstem</p><button class="mainbtn" id="start">▶ ZAČÍT HRÁT</button><p class="small">Verze 0.1 · Hra trvá 60 sekund</p></div></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),game=$('game'),player=$('player');let lane=1,score=0,time=60,running=false,objects=[],last=0,spawn=0,raf=0,action='';const centers=['16.7%','50%','83.3%'];function place(){player.style.left=centers[lane];$('laneLabel').textContent=lane+1}function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));place()}function pose(a){if(!running)return;player.classList.remove('jump','slide');void player.offsetWidth;if(a==='jump'){player.classList.add('jump');setTimeout(()=>player.classList.remove('jump'),650)}if(a==='slide'){player.classList.add('slide');setTimeout(()=>player.classList.remove('slide'),650)}}function spawnObj(){let l=Math.floor(Math.random()*3),kind=Math.random()<.58?'hazard':'food';let el=document.createElement('div');el.className='object '+kind;el.textContent=kind==='food'?'🍟':['🚧','🚇','📦'][Math.floor(Math.random()*3)];el.style.left=centers[l];el.style.top='-70px';el.style.transform='translateX(-50%)';game.appendChild(el);objects.push({el,l,kind,y:-70,passed:false})}
function tick(now){if(!running)return;let dt=Math.min((now-last)/1000,.05);last=now;spawn+=dt;if(spawn>0.95){spawn=0;spawnObj()}for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.y+=260*dt;o.el.style.top=o.y+'px';if(o.y>game.clientHeight*.70&&o.y<game.clientHeight*.86&&o.l===lane&&!o.passed){o.passed=true;if(o.kind==='food'){score+=10;$('score').textContent=score}else if(!player.classList.contains('jump')&&!player.classList.contains('slide')){finish(false)}}if(o.y>game.clientHeight+80){o.el.remove();objects.splice(i,1)}}raf=requestAnimationFrame(tick)}
let clock;function start(){cancelAnimationFrame(raf);objects.forEach(o=>o.el.remove());objects=[];lane=1;score=0;time=60;spawn=0;running=true;place();$('score').textContent='0';$('time').textContent='60';$('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(tick);clearInterval(clock);clock=setInterval(()=>{if(!running)return;time--;$('time').textContent=time;if(time<=0)finish(true)},1000)}
function finish(won){running=false;cancelAnimationFrame(raf);clearInterval(clock);$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><h1>'+(won?'🏆 Skvělá práce!':'🚨 Pozor, překážka!')+'</h1><p>'+(won?'Doběhli jste do cíle!':'Policista narazil na překážku.')+'</p><p>Nasbírané body: <b>'+score+'</b></p><button class="mainbtn" id="again">↻ HRÁT ZNOVU</button><p class="small">Krtek Stanislav · Verze 0.1</p></div>';$('again').onclick=start}
$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=()=>pose('jump');$('slide').onclick=()=>pose('slide');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')pose('jump');if(e.key==='ArrowDown')pose('slide')});let sx=0,sy=0;game.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});game.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(Math.abs(dy)>35)pose(dy<0?'jump':'slide')},{passive:true});place()})();
</script></body></html>
