<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chyť krtka – Skupina 3</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#d8edcc;color:#24334a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}main{width:min(100%,720px);margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(28px,7vw,44px);margin:8px 0}.version{font-size:13px;color:#667085}.info{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:700}.badge{background:#fff;padding:9px 14px;border-radius:12px;box-shadow:0 3px 12px #0001}#start{border:0;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:700;background:#265eac;color:white;cursor:pointer;touch-action:manipulation}#board{margin:18px auto 0;width:min(92vw,620px);aspect-ratio:1.25;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,14px);background:#7a5131;padding:clamp(10px,2vw,16px);border-radius:24px;box-shadow:0 8px 20px #0002}.hole{position:relative;border:0;background:#422919;border-radius:50%;overflow:hidden;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 8px 10px #0005}.mole{position:absolute;inset:12% 12% -8%;display:grid;place-items:center;font-size:clamp(48px,11vw,82px);animation:pop .12s ease-out}@keyframes pop{from{transform:translateY(35%)}to{transform:translateY(0)}}.message{min-height:32px;font-weight:700;font-size:18px;margin:14px}@media(max-width:480px){body{padding:10px}.top{justify-content:center}.info{gap:7px}.badge{padding:8px 10px;font-size:14px}}</style></head><body><main><div class="top"><h1>🐹 Chyť krtka</h1><span class="version">Skupina 3 · verze 1.0</span></div><div class="info"><span class="badge">⭐ Skóre: <b id="score">0</b></span><span class="badge">⏱️ Čas: <b id="time">30</b> s</span><button id="start">Začít hru</button></div><div id="board" aria-label="Herní plocha"></div><div id="message" class="message">Klikni na „Začít hru“ a chyť co nejvíc krtků!</div></main><script>const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),message=document.querySelector('#message'),start=document.querySelector('#start');let score=0,time=30,timer=null,moleTimer=null,playing=false;for(let i=0;i<9;i++){const hole=document.createElement('button');hole.className='hole';hole.setAttribute('aria-label','Díra');hole.addEventListener('click',()=>{if(!playing)return;const mole=hole.querySelector('.mole');if(mole){score++;scoreEl.textContent=score;mole.remove();showMole()}});board.appendChild(hole)}function showMole(){if(!playing)return;document.querySelectorAll('.mole').forEach(x=>x.remove());const holes=document.querySelectorAll('.hole');const hole=holes[Math.floor(Math.random()*holes.length)];const mole=document.createElement('span');mole.className='mole';mole.textContent='🐹';mole.setAttribute('aria-hidden','true');hole.appendChild(mole)}function startGame(){clearInterval(timer);clearTimeout(moleTimer);score=0;time=30;playing=true;scoreEl.textContent=0;timeEl.textContent=30;message.textContent='Chytej krtka!';start.textContent='Hrát znovu';showMole();moleTimer=setTimeout(moveMole,650);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}function endGame(){clearInterval(timer);clearTimeout(moleTimer);playing=false;document.querySelectorAll('.mole').forEach(x=>x.remove());message.textContent='Konec hry! Tvoje skóre: '+score+'.';start.textContent='Hrát znovu'}function moveMole(){if(!playing)return;showMole();moleTimer=setTimeout(moveMole,Math.max(450,900-score*10))}start.addEventListener('click',startGame);</script></body></html>
