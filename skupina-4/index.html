<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chyť krtka – skupina 4</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:18px;background:#d8edcc;color:#24334a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{width:min(100%,620px);margin:0 auto;background:#fff;padding:clamp(18px,4vw,32px);border-radius:24px;box-shadow:0 10px 32px #0001}
h1{font-size:clamp(30px,7vw,44px);margin:8px 0}.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:20px;font-weight:700;margin:16px 0}
button{font:inherit;cursor:pointer;touch-action:manipulation}.start{border:0;border-radius:14px;background:#287a43;color:white;padding:13px 28px;font-weight:700;font-size:19px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,14px);margin:22px auto;max-width:460px}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:#8b5a36;box-shadow:inset 0 8px 0 #684126;display:grid;place-items:center;font-size:clamp(38px,12vw,68px);overflow:hidden}
.hole:focus-visible,.start:focus-visible{outline:4px solid #f4b942;outline-offset:3px}
.hole span{transform:translateY(8px)}.hole.active{background:#a56d43}
.message{min-height:28px;font-size:17px}.version{color:#667085;font-size:13px;margin-top:20px}
@media(max-width:420px){body{padding:10px}main{padding:16px 12px}.stats{gap:14px;font-size:18px}}
</style>
</head>
<body><main>
<div aria-hidden="true" style="font-size:48px">🌳</div>
<h1>Chyť krtka!</h1><h2>Skupina 4</h2>
<div class="stats"><div>⭐ Body: <span id="score">0</span></div><div>⏱️ Čas: <span id="time">20</span> s</div></div>
<button class="start" id="start">Začít hru</button>
<div class="board" id="board" aria-label="Herní plocha">
<button class="hole" data-hole="0" aria-label="Díra 1"><span>🕳️</span></button>
<button class="hole" data-hole="1" aria-label="Díra 2"><span>🕳️</span></button>
<button class="hole" data-hole="2" aria-label="Díra 3"><span>🕳️</span></button>
<button class="hole" data-hole="3" aria-label="Díra 4"><span>🕳️</span></button>
<button class="hole" data-hole="4" aria-label="Díra 5"><span>🕳️</span></button>
<button class="hole" data-hole="5" aria-label="Díra 6"><span>🕳️</span></button>
<button class="hole" data-hole="6" aria-label="Díra 7"><span>🕳️</span></button>
<button class="hole" data-hole="7" aria-label="Díra 8"><span>🕳️</span></button>
<button class="hole" data-hole="8" aria-label="Díra 9"><span>🕳️</span></button>
</div>
<p class="message" id="message" aria-live="polite">Stiskni „Začít hru“ a chytej krtka!</p>
<p class="version">Verze 1.0 · Skupina 4</p>
</main>
<script>
const holes=[...document.querySelectorAll('.hole')],scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),message=document.getElementById('message'),start=document.getElementById('start');
let score=0,time=20,current=-1,playing=false,timer=null,moleTimer=null;
function hideMole(){holes.forEach(h=>{h.innerHTML='<span>🕳️</span>';h.classList.remove('active')});current=-1}
function showMole(){hideMole();current=Math.floor(Math.random()*holes.length);holes[current].innerHTML='<span>🐹</span>';holes[current].classList.add('active')}
function endGame(){playing=false;clearInterval(timer);clearInterval(moleTimer);hideMole();start.disabled=false;start.textContent='Hrát znovu';message.textContent='Konec hry! Získal/a jsi '+score+' bodů. Skvělá práce!'}
function begin(){clearInterval(timer);clearInterval(moleTimer);score=0;time=20;playing=true;scoreEl.textContent=score;timeEl.textContent=time;message.textContent='Rychle! Najdi krtka a klepni na něj.';start.disabled=true;start.textContent='Hra běží…';showMole();moleTimer=setInterval(showMole,850);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}
holes.forEach((hole,i)=>hole.addEventListener('click',()=>{if(!playing)return;if(i===current){score++;scoreEl.textContent=score;showMole()}}));
start.addEventListener('click',begin);
</script>
</body></html>
