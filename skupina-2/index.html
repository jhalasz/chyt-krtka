<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24334a;background:#d8edcc}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:clamp(10px,3vw,26px);display:grid;place-items:center}
main{width:min(100%,640px);background:#fff;border-radius:26px;padding:clamp(16px,4vw,30px);box-shadow:0 12px 36px #23401d20;text-align:center}
h1{font-size:clamp(30px,7vw,46px);margin:4px 0}
.subtitle{margin:5px 0 16px;font-size:clamp(15px,3.5vw,18px)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.stat{background:#f0f7eb;border-radius:14px;padding:10px 4px}
.stat strong{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#52634f}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.5vw,15px);width:min(100%,440px);margin:18px auto}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:#75472d;box-shadow:inset 0 8px 0 #56331f,0 5px 0 #6f482e;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:manipulation;cursor:pointer}
.hole:focus-visible{outline:4px solid #f0b429;outline-offset:3px}
.mole{display:block;width:82%;height:82%;max-width:100px;max-height:100px;transform:translateY(5px);user-select:none;pointer-events:none}
.hole:not(.up) .mole{visibility:hidden}
.hole.up{background:#a96e43}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
button.action{border:0;border-radius:14px;padding:13px 22px;font:700 17px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
#start{background:#287a3e;color:white}#start:disabled{opacity:.55;cursor:default}
#reset{background:#edf2e9;color:#344b32}
#message{min-height:28px;font-weight:650;font-size:17px}
.help{font-size:14px;color:#596657;margin:8px 0}
.version{font-size:12px;color:#7a8477;margin-top:18px}
@media(max-width:380px){main{padding:14px}.stats{gap:5px}.stat{padding:8px 2px}}
</style>

<script>
(() => {
 const holes=[...document.querySelectorAll(".hole")];
 const scoreEl=document.getElementById("score"),timeEl=document.getElementById("time");
 const bestEl=document.getElementById("best"),message=document.getElementById("message");
 const startBtn=document.getElementById("start");
 let score=0,time=30,best=0,current=-1,playing=false,tick=null,moleTimer=null;
 try{best=Number(localStorage.getItem("krtek-sk2-best"))||0}catch(e){}
 bestEl.textContent=best;
 function hideMole(){holes.forEach(h=>h.classList.remove("up"));current=-1}
 function showMole(){
   if(!playing)return;
   let next=Math.floor(Math.random()*holes.length);
   if(holes.length>1&&next===current)next=(next+1+Math.floor(Math.random()*(holes.length-1)))%holes.length;
   hideMole();current=next;holes[current].classList.add("up");
   moleTimer=setTimeout(showMole,Math.max(430,1050-score*22));
 }
 function finish(){
   playing=false;clearInterval(tick);clearTimeout(moleTimer);hideMole();startBtn.disabled=false;
   message.textContent="Konec hry! Získal/a jsi "+score+" bodů. Zkus překonat svůj rekord!";
 }
 function start(){
   if(playing)return;
   clearInterval(tick);clearTimeout(moleTimer);score=0;time=30;playing=true;
   scoreEl.textContent=score;timeEl.textContent=time;startBtn.disabled=true;
   message.textContent="Hurá! Chytej krtka!";showMole();
   tick=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000);
 }
 holes.forEach(h=>h.addEventListener("click",()=>{
   if(!playing||!h.classList.contains("up"))return;
   score++;scoreEl.textContent=score;
   if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("krtek-sk2-best",String(best))}catch(e){}}
   clearTimeout(moleTimer);hideMole();showMole();
 }));
 startBtn.addEventListener("click",start);
 document.getElementById("reset").addEventListener("click",()=>{
   clearInterval(tick);clearTimeout(moleTimer);playing=false;score=0;time=30;
   scoreEl.textContent=score;timeEl.textContent=time;hideMole();startBtn.disabled=false;
   message.textContent="Připraven/a? Stiskni Začít hru.";
 });
})();
</script>
